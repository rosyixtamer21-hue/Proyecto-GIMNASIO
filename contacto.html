<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Gym | Contactos</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <h1>POWER <span>GYM</span></h1>
        </div>
        <nav class="nav">
            <ul>
                <li><a href="index.html">INICIO</a></li>
                <li><a href="historia.html">HISTORIA</a></li>
                <li><a href="planes.html">PLANES</a></li>
                <li><a href="entrenadores.html">ENTRENADORES</a></li>
                <li><a href="instalaciones.html">INSTALACIONES</a></li>
                <li><a href="contacto.html" class="activo">CONTACTO</a></li>
            </ul>
        </nav>
    </header>

    <section class="ubicacion" style="padding: 40px 20px; max-width: 600px; margin: 0 auto;">
        <h2>CONTACTO Y UBICACIÓN</h2>
        <p style="text-align: center; margin-bottom: 30px;">
            Estamos ubicados en Cantón Chuitinamit, San Juan La Laguna, Sololá. ¡Visítanos!
        </p>

       <form id="formContacto" action="#" method="POST" style="background-color: #141414; padding: 30px; border-radius: 8px; border: 1px solid #222;">
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: bold;">Tu Nombre:</label>
                <input type="text" id="nombre" placeholder="Escribe tu nombre" style="width: 100%; padding: 12px; background-color: #0b0b0b; border: 1px solid #333; color: white; border-radius: 4px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: bold;">Tu Correo:</label>
                <input type="email" id="correo" placeholder="correo@ejemplo.com" style="width: 100%; padding: 12px; background-color: #0b0b0b; border: 1px solid #333; color: white; border-radius: 4px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: bold;">Mensaje:</label>
                <textarea id="mensaje" rows="4" placeholder="¿En qué te podemos ayudar?" style="width: 100%; padding: 12px; background-color: #0b0b0b; border: 1px solid #333; color: white; border-radius: 4px;"></textarea>
            </div>

            <button type="submit" style="width: 100%; background-color: #e31b23; color: white; padding: 14px; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">ENVIAR MENSAJE</button>
        </form>
    </section>

    <footer>
        <p>San Juan La Laguna, Sololá</p>
    </footer>

    <!-- CONEXIÓN CON JAVASCRIPT -->
    <script src="js/script.js"></script>
</body>
</html>
